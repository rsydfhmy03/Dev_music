name: dev_music
description: "A Flutter application for music playback and management."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.5 
  get_it: ^7.7.0
  just_audio: ^0.9.38
  audio_service: ^0.18.13
  on_audio_query: ^2.9.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.3
  equatable: ^2.0.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  change_app_package_name: ^1.1.0 
  flutter_lints: ^5.0.0
  build_runner: ^2.4.9
  hive_generator: ^2.0.1


